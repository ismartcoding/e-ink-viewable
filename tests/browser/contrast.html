<!doctype html>
<html lang="en"><meta charset="utf-8"><title>High contrast browser checks</title>
<style>body{margin:0;background:#fff;color:#000;font:16px sans-serif}iframe{width:100%;height:800px;border:0}pre{margin:16px;white-space:pre-wrap}</style>
<iframe title="Isolated high contrast fixture"></iframe><pre id="results">Loading checks…</pre>
<script>
window.addEventListener('message', event => {
    if (event.source === document.querySelector('iframe').contentWindow && event.data.type === 'contrast-results') {
        document.querySelector('#results').textContent = JSON.stringify(event.data, null, 2)
    }
})
fetch('contrast-fixture.html'+location.search).then(response => response.text()).then(html => { document.querySelector('iframe').srcdoc = html })
</script></html>
