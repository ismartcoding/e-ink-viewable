<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>E-ink Viewable</title>
    <link rel="stylesheet" href="css/popup.css" />
</head>

<body>
    <header class="head">
        <img src="icons/icon_32.png" alt="" width="20" height="20" />
        <h1 id="app-title"></h1>

        </button>
        <button type="button" id="help" class="icon-btn" aria-label="Help" title="Help">?</button>
    </header>

    <main>
        <section class="group">
            <p class="group-label" id="site-label"></p>
            <div class="seg" id="site-modes">
                <button type="button" data-mode="auto"></button>
                <button type="button" data-mode="contrast"></button>
                <button type="button" data-mode="off"></button>
            </div>
        </section>

        <section class="help-panel" id="settings-panel" hidden>
            <p class="panel-title" id="settings-title"></p>
            <div class="seg" id="default-modes">
                <button type="button" data-mode="auto"></button>
                <button type="button" data-mode="contrast"></button>
                <button type="button" data-mode="off"></button>
            </div>
            <p class="group-label" id="lang-label"></p>
            <select id="lang-select" class="lang-select">
                <option value=""></option>
                <option value="en">English</option>
                <option value="zh_CN">简体中文</option>
                <option value="zh_TW">繁體中文</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="es">Español</option>
                <option value="pt_BR">Português (Brasil)</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="ru">Русский</option>
                <option value="ar">العربية</option>
                <option value="hi">हिन्दी</option>
                <option value="id">Bahasa Indonesia</option>
                <option value="vi">Tiếng Việt</option>
                <option value="th">ไทย</option>
                <option value="tr">Türkçe</option>
            </select>
            <p class="panel-hint" id="settings-hint"></p>
        </section>

        <section class="help-panel" id="help-panel" hidden>
            <p id="help-auto"></p>
            <p id="help-contrast"></p>
            <p id="help-off"></p>
            <p id="help-default"></p>
        </section>
    </main>

    <footer class="foot">
        <a href="#" id="shortcuts"></a>
        <a class="promo" id="promo" href="https://plainapp.app" target="_blank" rel="noreferrer"></a>
    </footer>

    <script src="toggle.js"></script>
    <script src="popup-ui.js"></script>
    <script src="popup.js"></script>
</body>

</html>
